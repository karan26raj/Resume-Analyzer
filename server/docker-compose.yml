# Local infrastructure for development: PostgreSQL, Qdrant and Redis.
# Start with `docker compose up -d`, then run `alembic upgrade head` and `uvicorn app.main:app --reload`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resume_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Cache and rate-limit counters only, so nothing needs to survive a restart. volatile-lru evicts
  # only keys with a TTL, never the per-user cache version counters.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
